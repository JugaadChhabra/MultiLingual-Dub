services:
  autodub:
    image: ghcr.io/jugaadchhabra/autodub:latest
    # Always fetch the newest published image on `up` — users get updates
    # automatically without ever running `docker compose pull`.
    pull_policy: always
    ports:
      - "8080:8080"
    volumes:
      # What the container writes and must keep across a restart. Each of these
      # is a path the code actually uses: uploads is api.routes.UPLOAD_DIR,
      # output holds renders and the script history, data holds QC artefacts.
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./data:/app/data
    environment:
      ISHWARI_VOICE_ID: ${ISHWARI_VOICE_ID}
      HEYGEN_ISHWARI: ${HEYGEN_ISHWARI}
      US_VOICE_ID: ${US_VOICE_ID}

      ELEVEN_LABS: ${ELEVEN_LABS}
      DESI_VOCAL_VOICE: ${DESI_VOCAL_VOICE}
      ENGLISH_VOICE: ${ENGLISH_VOICE}

      SARVAM_API: ${SARVAM_API}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Model lists are optional — each falls back to a default in code. They are
      # passed through so a model can be changed or rolled back from .env alone,
      # without waiting on an image rebuild.
      GEMINI_QC_MODELS: ${GEMINI_QC_MODELS:-}
      GEMINI_SCRIPT_MODELS: ${GEMINI_SCRIPT_MODELS:-}

      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_REGION: ${AWS_REGION}

      BATCH_ENABLE_S3_UPLOAD: ${BATCH_ENABLE_S3_UPLOAD:-true}
      BATCH_ENABLE_QC: ${BATCH_ENABLE_QC:-true}

      # NAS upload target. Without these the container falls back to NAS_MODE=local
      # and silently writes to an unmounted /app/nas_data — the SMB upload never runs.
      # US-character content uploads here instead of NAS_ROOT_PATH.
      NAS_MODE: ${NAS_MODE:-local}
      NAS_ROOT_PATH: ${NAS_ROOT_PATH:-}
      US_CHARACTER_NAS_ROOT_PATH: ${US_CHARACTER_NAS_ROOT_PATH:-}
      NAS_SERVER: ${NAS_SERVER:-}
      NAS_SHARE: ${NAS_SHARE:-}
      NAS_USERNAME: ${NAS_USERNAME:-}
      NAS_PASSWORD: ${NAS_PASSWORD:-}
      NAS_DOMAIN: ${NAS_DOMAIN:-}
      NAS_PORT: ${NAS_PORT:-445}

      API_RETRY_MAX_ATTEMPTS: ${API_RETRY_MAX_ATTEMPTS:-20}
      API_RETRY_BASE_DELAY_S: ${API_RETRY_BASE_DELAY_S:-1.0}
      API_RETRY_MAX_DELAY_S: ${API_RETRY_MAX_DELAY_S:-60.0}

    restart: unless-stopped

    # No healthcheck here on purpose. The image defines its own (see Dockerfile),
    # which probes /health with httpx — a dependency it actually installs. The
    # override that used to live here called curl, which is not in python:slim
    # and is not installed by the Dockerfile, so it could never pass and the
    # container reported unhealthy for its whole life.

# Usage:
# 1. Create/edit .env and fill all required keys
# 2. docker compose up -d   (auto-pulls the latest image — no manual pull needed)
# 3. Access at http://localhost:8080
#
# To update later: just run `docker compose up -d` again. `pull_policy: always`
# fetches the newest image automatically before (re)starting.
#
# Note for Windows: `pull_policy: always` contacts the registry on every `up`,
# which invokes Docker Desktop's credential helper. That helper needs an
# interactive logon session, so `up` fails over SSH with "A specified logon
# session does not exist". Run it from the desktop session, or use
# `docker compose up -d --pull never` to start the image already on disk.
